<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <style>
    .mono { font-family: 'Courier New', Consolas, 'DejaVu Sans Mono', monospace; }
    .amber { fill: #ffb000; }
    .dim { fill: #a3721a; }
    .faint { fill: #5c4419; }
    .glow { filter: url(#glow); }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .type1 { animation: reveal 1.2s steps(18) 0.3s both; }
    .type2 { animation: reveal 1.4s steps(26) 2.0s both; }
    .fade { animation: fade 0.6s ease 1.5s both; }
    .fade2 { animation: fade 0.6s ease 3.4s both; }
    @keyframes reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <defs>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffb000" opacity="0.025"/>
    </pattern>
  </defs>

  <!-- window -->
  <rect x="10" y="10" width="1180" height="360" rx="14" fill="#0d1117" stroke="#3a2c12" stroke-width="2"/>
  <rect x="10" y="10" width="1180" height="42" rx="14" fill="#16120a"/>
  <rect x="10" y="38" width="1180" height="14" fill="#16120a"/>
  <circle cx="40" cy="31" r="7" fill="#5c4419"/>
  <circle cx="64" cy="31" r="7" fill="#5c4419"/>
  <circle cx="88" cy="31" r="7" fill="#5c4419"/>
  <text x="600" y="37" text-anchor="middle" class="mono dim" font-size="15">sahil@sahilk.io: ~</text>
  <rect x="10" y="52" width="1180" height="318" fill="url(#scan)"/>

  <!-- line 1 -->
  <g class="mono" font-size="22">
    <text x="48" y="100"><tspan class="dim">sahil@sahilk.io:~$ </tspan><tspan class="amber type1">whoami</tspan></text>
  </g>

  <!-- name -->
  <g class="fade">
    <text x="48" y="178" class="mono amber glow" font-size="64" font-weight="700" letter-spacing="6">SAHIL KHETARPAL</text>
    <text x="50" y="216" class="mono dim" font-size="20" letter-spacing="2">Information Security &amp; Compliance Engineer  //  Cloud Security  //  GRC</text>
  </g>

  <!-- line 2 -->
  <g class="mono" font-size="22">
    <text x="48" y="276"><tspan class="dim">sahil@sahilk.io:~$ </tspan><tspan class="amber type2">cat focus.txt</tspan></text>
  </g>
  <g class="fade2">
    <text x="48" y="314" class="mono amber" font-size="19">vulnerability management · detection engineering · HIPAA / HITRUST · AWS · Azure</text>
    <text x="48" y="350" class="mono" font-size="22"><tspan class="dim">sahil@sahilk.io:~$ </tspan><tspan class="amber cursor">█</tspan></text>
  </g>
  <text x="1160" y="350" text-anchor="end" class="mono faint" font-size="14">[ status: online ]</text>
</svg>
